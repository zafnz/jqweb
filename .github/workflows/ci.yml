name: ci

# A branch with an open pull request matches both events, so pushing to one
# used to run everything here twice. Each event now covers only what the other
# cannot: pull_request tests a branch, and against the merge commit rather than
# the branch alone, so it catches what only breaks once merged; push covers
# main, which is where merges and any direct commits land.
on:
  push:
    branches: [main]
  pull_request:
  # A branch with no pull request open gets no CI of its own, so this is how to
  # ask for a run by hand.
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs on a pull request are worth nothing once another push has
# landed. Runs on main are left to finish, so every commit there keeps a result
# rather than a gap where it was cancelled.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from go.mod and the current release. Decoder behaviour has
        # differed between them before, and the error messages depend on it.
        go-version: ["1.26", "stable"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - run: go test ./...

      - name: build
        run: go build -o /dev/null .

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # web/core.js is the DOM-free half of the page script, so node runs its
      # tests directly; no package.json and no dependencies.
      - run: node --test

  # The other half of the page only exists in a browser: the tree, the search
  # box, the suggestion list, folding, scrolling, the toolbar and the two
  # palettes. The drivers render a page, load it in the Chrome the runner
  # image already carries, and read their findings back out of it. Nothing is
  # installed for this, and there is no automation library behind it.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A page has to be rendered before it can be driven, and rendering one
      # means building jqweb.
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Named rather than assumed: a runner image that stopped shipping Chrome
      # should say so here rather than inside the runner.
      - run: google-chrome --version

      - run: node web/browser/run.js --keep=${{ runner.temp }}/pages

      # A kept page is the document, the harness and one driver in one file,
      # so a failure can be opened in a browser and watched.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-pages
          path: ${{ runner.temp }}/pages/*.run.html
