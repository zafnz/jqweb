name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      notary_retry_delays:
        description: "Seconds before each attempt. Empty uses 0 300 600 1200."
        required: false

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A v* tag starts this workflow, but only a tag whose commit has reached
      # main is allowed to publish. That keeps branch-local release-looking
      # tags from building assets, creating a GitHub release or updating the
      # Homebrew tap.
      - name: Release tags must point at main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point at a commit contained in origin/main."
            exit 1
          fi

      # The release notes are the CHANGELOG.md section for this tag. Taking
      # them out here, rather than pointing GoReleaser at the file, is what
      # makes a missing section stop the release: GoReleaser treats an empty
      # --release-header as a warning and publishes without it, leaving a
      # release page that tells everyone upgrading nothing at all.
      #
      # The awk prints what lies between the heading for this version and the
      # next heading or the link definitions. It writes outside the checkout,
      # because a file left in the working tree makes it dirty and GoReleaser
      # refuses to release from a dirty tree. Both run before anything is
      # built.
      - name: Take this tag's release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { inside = 1; next }
            /^## / || /^\[[^]]*\]: / { inside = 0 }
            inside { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-header.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-header.md"; then
            echo "::error file=CHANGELOG.md::No '## [${version}]' section with anything under it. Rename '## [Unreleased]' to '## [${version}] - $(date -u +%F)', update the link definitions, then move the tag."
            exit 1
          fi
          echo "release notes for ${version}: $(wc -l < "$RUNNER_TEMP/release-header.md") lines"

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # The page scripts are embedded in the binary, so a JavaScript
      # regression ships in a release too. GoReleaser runs the Go tests
      # itself, from its before hooks.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: node --test

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true

      # Apple's notary service is the one part of a release that is neither
      # ours nor reliable. 0.5.0 failed on "context deadline exceeded" posting
      # a submission and then succeeded, unchanged, on a re-run minutes later.
      #
      # Publishing is the last thing GoReleaser does and notarising is several
      # steps before it, so a run that dies there has created no release, no
      # assets and no tap commit: the next attempt starts from nothing. That is
      # what makes retrying the whole command safe rather than only tidy.
      #
      # Anything that is not the notary service fails on the spot. Waiting
      # thirty-five minutes to watch the same compile error four times helps
      # nobody.
      - name: Release, waiting out Apple's notary service if it is unreachable
        env:
          # Seconds before each attempt. The workflow_dispatch input overrides
          # them, so the retrying itself can be exercised without waiting out
          # the real delays, and a tag whose notarisation outlasted all four
          # attempts can be released again by hand.
          NOTARY_RETRY_DELAYS: ${{ inputs.notary_retry_delays || '0 300 600 1200' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -o pipefail
          attempt=0
          for delay in $NOTARY_RETRY_DELAYS; do
            attempt=$((attempt + 1))
            if [ "$delay" -gt 0 ]; then
              echo "::notice::Apple's notary service did not answer. Waiting ${delay}s, then attempt ${attempt}."
              sleep "$delay"
            fi
            if goreleaser release --clean --release-header "$RUNNER_TEMP/release-header.md" 2>&1 | tee /tmp/goreleaser.log; then
              exit 0
            fi
            if ! grep -qiE 'notariz|notary|appstoreconnect\.apple\.com' /tmp/goreleaser.log; then
              echo "::error::Release failed, and not at Apple's notary service. Not retrying."
              exit 1
            fi
          done
          echo "::error::Apple's notary service did not answer across ${attempt} attempts."
          exit 1
