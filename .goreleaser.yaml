version: 2

project_name: jqweb

before:
  hooks:
    - go mod tidy
    # A tagged release should not ship what CI would have rejected.
    - go test ./...

builds:
  - id: jqweb
    main: .
    binary: jqweb
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.versionString={{ .Version }}

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - jqweb
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - id: jqweb
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  # Rewritten for each release: it is what this one changed, not what the tool
  # does. GoReleaser puts it above the commit list on the release page.
  #
  # Bump this marker along with the prose. Nothing else can tell whether the
  # notes below were written for the tag being released, so the release
  # workflow compares the two and refuses to publish when they disagree.
  # notes-for: 0.6.0
  header: |
    ## Stop serving once the page has been fetched

    `-C` (or `--close`) serves the page and exits once a browser has fetched
    it, instead of holding the terminal until Ctrl-C. `-OC` does that and
    opens the browser:

    ```
    jqweb -OC deploy.json
    ```

    The wait is `--close-delay`, 1 second by default.

    **Fixed:** the one-dash spellings of the long flags -- `-theme`, `-host`,
    `-port` and `-output` -- could take the wrong value once the arguments
    were reordered, and now behave as their two-dash forms do.

changelog:
  # The empty string is git order, which reads as the work happened; "asc" is
  # alphabetical by whatever word a subject starts with. Spelled out rather
  # than left off, so that it reads as a choice.
  sort: ""
  # The commit list sits under the notes above, so it wants to be readable
  # rather than complete: a full SHA on every line is 40 characters of nothing
  # anyone reads, and a merge commit says only that a branch arrived.
  abbrev: -1
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^Merge pull request"
      - "^Merge branch"

homebrew_casks:
  - name: jqweb
    binaries:
      - jqweb
    directory: Casks
    homepage: https://github.com/zafnz/jqweb
    description: Renders JSON like jq, but as a webpage
    license: MIT
    repository:
      owner: zafnz
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: goreleaserbot@users.noreply.github.com
