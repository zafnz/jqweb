version: 2

project_name: jqweb

before:
  hooks:
    - go mod tidy
    # A tagged release should not ship what CI would have rejected.
    - go test ./...

builds:
  - id: jqweb
    main: .
    binary: jqweb
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.versionString={{ .Version }}

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - jqweb
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - id: jqweb
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  # Rewritten for each release: it is what this one changed, not what the tool
  # does. GoReleaser puts it above the commit list on the release page.
  #
  # Bump this marker along with the prose. Nothing else can tell whether the
  # notes below were written for the tag being released, so the release
  # workflow compares the two and refuses to publish when they disagree.
  # notes-for: 0.5.0
  header: |
    ## More of jq

    The search box understands about 105 filters, up from 62. The ones worth
    knowing about:

    **Regular expressions** -- `match`, `capture`, `scan`, `splits`, `sub` and
    `gsub`, alongside the `test` that was already there. A replacement is a
    filter run against the match's named captures, so jq's own example works:
    `gsub("(?<c>l)"; "[" + .c + "]")`.

    **Format strings**, written with an `@` as jq writes them: `@text`,
    `@json`, `@csv`, `@tsv`, `@uri`, `@html`, `@sh`, `@base64` and `@base64d`.
    `@base64d` is the one that makes a Kubernetes secret readable.

    **`any(gen; cond)` and `all(gen; cond)`**, which take a stream rather than
    the input's own members, so a test can reach anywhere in a subtree:
    `.items[] | select(any(.. | objects; .containerPort? == 80))`.

    **`paths`, `paths(f)` and `getpath`** for looking at the shape of a
    document, and `walk`, `while`, `until`, `isempty`, `error` and
    `recurse(f; cond)`.

    **Dates** -- `now`, `todate`, `fromdate`, `gmtime`, `mktime` and
    `strftime`, which is what a Kubernetes timestamp wants.

    Also `explode`, `implode`, and `pow`, `log`, `log2`, `log10`, `exp`,
    `exp2`, `exp10` and `trunc`.

    Nothing here edits a document. `del`, `setpath` and the assignment
    operators need path expressions, and the page is for reading a document
    rather than changing one. Variables, `def`, `reduce`, `foreach`,
    `try`/`catch` and string interpolation are still out, and a query using one
    says so by name.

    ## Page size

    The engine is about 70KB in a page, up from about 53KB in 0.4.1. `--simple`
    is unchanged, since none of this ships in one.

changelog:
  # The empty string is git order, which reads as the work happened; "asc" is
  # alphabetical by whatever word a subject starts with. Spelled out rather
  # than left off, so that it reads as a choice.
  sort: ""
  # The commit list sits under the notes above, so it wants to be readable
  # rather than complete: a full SHA on every line is 40 characters of nothing
  # anyone reads, and a merge commit says only that a branch arrived.
  abbrev: -1
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^Merge pull request"
      - "^Merge branch"

homebrew_casks:
  - name: jqweb
    binaries:
      - jqweb
    directory: Casks
    homepage: https://github.com/zafnz/jqweb
    description: Renders JSON like jq, but as a webpage
    license: MIT
    repository:
      owner: zafnz
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: goreleaserbot@users.noreply.github.com
