version: 2

project_name: jqweb

before:
  hooks:
    - go mod tidy
    # A tagged release should not ship what CI would have rejected.
    - go test ./...

builds:
  - id: jqweb
    main: .
    binary: jqweb
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.versionString={{ .Version }}

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - jqweb
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - id: jqweb
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  header: |
    ## jq queries

    The search box answers jq queries as well as finding text: paths,
    iteration, slices, pipes, `//`, `?`, comparisons, arithmetic,
    if/then/elif/else/end, array and object construction, and about 60 builtins
    including `select`, `map`, `keys`, `to_entries`, `sort_by`, `group_by`,
    `unique_by`, `flatten`, `range`, `join`, `test` and `index`. Variables,
    `def`, `reduce`, assignment, string interpolation and format strings are
    not there, and a query using one says so by name rather than guessing at
    what it meant.

    A query whose output is not part of the document replaces the tree with its
    results. One that only walks down, such as `.a.b[3]`, highlights that node,
    the way a pasted path always has.

    ## Filtering on a value

    Every line has a second button. It fills the search box with a query built
    from that line and offers the other queries the line could have meant, each
    labelled with what it returns -- 14 results against 1 says which reading
    was meant without anyone having to work out the jq.

    ## Light and dark

    The page follows the reader's system. The button at the right of the
    toolbar cycles auto, light and dark and remembers the choice; `--theme
    light` or `--theme dark` sets what a page starts in.

    ## Toolbar

    Expand all and Collapse all are one button, moved to the right, and the
    search box fills the room they left.

    ## Page size

    The query engine is inlined into every page, which makes one about 57KB
    larger than 0.3.0 whatever the document. `--simple` leaves it out, for a
    page that browses, filters and looks up paths and nothing else; that one is
    about 5KB larger than 0.3.0, which is the second colour palette.

    Against that, the comments in the page scripts are no longer served to
    every reader of a page. They were written for someone reading `web/*.js`
    and were being inlined along with the code; stripping them takes about 10KB
    off a page before any of the above is added.

    ## Truncated input

    JSON that ends inside an unclosed container reports that it was truncated,
    rather than an end-of-input error, whichever version of Go built the
    binary. Go 1.27 changed what the decoder returns there, which had made the
    message worse in a binary built with it.

changelog:
  # The empty string is git order, which reads as the work happened; "asc" is
  # alphabetical by whatever word a subject starts with. Spelled out rather
  # than left off, so that it reads as a choice.
  sort: ""
  # The commit list sits under the notes above, so it wants to be readable
  # rather than complete: a full SHA on every line is 40 characters of nothing
  # anyone reads, and a merge commit says only that a branch arrived.
  abbrev: -1
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^Merge pull request"
      - "^Merge branch"

homebrew_casks:
  - name: jqweb
    binaries:
      - jqweb
    directory: Casks
    homepage: https://github.com/zafnz/jqweb
    description: Renders JSON like jq, but as a webpage
    license: MIT
    repository:
      owner: zafnz
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: goreleaserbot@users.noreply.github.com
