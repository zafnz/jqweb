version: 2

project_name: jqweb

before:
  hooks:
    - go mod tidy
    # A tagged release should not ship what CI would have rejected.
    - go test ./...

builds:
  - id: jqweb
    main: .
    binary: jqweb
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.versionString={{ .Version }}

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - jqweb
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - id: jqweb
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# The prose above the commit list is the CHANGELOG.md section for the tag,
# which the release workflow extracts and passes as --release-header. A header
# set here as well would print above that one rather than replace it.
changelog:
  # The compare API rather than git log, so each line ends with the GitHub
  # username of whoever wrote the commit. For a branch merged here that is the
  # same list with a name on the end; it is for the commits that arrive from
  # outside. With no previous tag to compare against, GoReleaser falls back to
  # git log and the name is left off.
  use: github
  # Written out because the default format for any source other than git opens
  # each line with the full SHA: 40 characters of nothing anyone reads.
  format: "{{ .Message }}{{ with .AuthorUsername }} (@{{ . }}){{ end }}"
  # The empty string is git order, which reads as the work happened; "asc" is
  # alphabetical by whatever word a subject starts with. Spelled out rather
  # than left off, so that it reads as a choice.
  sort: ""
  # GoReleaser has no first-parent option. GitHub writes the mainline commit
  # for a merged pull request as the pull request title with "(#123)" on the
  # end, while the commits from the branch keep their original subjects. Keeping
  # only those subjects gives the release page the same shape as:
  #
  #   git log --first-parent --pretty=format:%s <previous-tag>..HEAD
  #
  # If include is set, GoReleaser ignores exclude.
  filters:
    include:
      - "\\(#[0-9]+\\)$"

homebrew_casks:
  - name: jqweb
    binaries:
      - jqweb
    directory: Casks
    homepage: https://github.com/zafnz/jqweb
    description: Turn JSON into an interactive webpage with one pipe.
    license: MIT
    repository:
      owner: zafnz
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: goreleaserbot@users.noreply.github.com

nfpms:
  - id: packages
    package_name: jqweb
    vendor: Nick Clifford
    maintainer: Nick Clifford <nick@nickclifford.com>
    homepage: https://github.com/zafnz/jqweb
    description: Turn JSON into an interactive webpage with one pipe.
    license: MIT
    formats:
      - deb
      - rpm
    # internal/update names the apt or dnf command only for a binary at
    # /usr/bin/jqweb. Change packagedPath there along with this.
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/jqweb/copyright

# GoReleaser's own Gemfury publisher is Pro-only, so this calls the push API
# that publisher wraps. Gemfury hosts the apt and yum repositories.
publishers:
  - name: gemfury
    ids:
      - packages
    dir: "{{ dir .ArtifactPath }}"
    # GoReleaser redacts the values in env from what it logs of the command,
    # and the token is in the URL.
    env:
      - FURY_TOKEN={{ .Env.FURY_TOKEN }}
    cmd: curl -fsS -F package=@{{ .ArtifactName }} https://{{ .Env.FURY_TOKEN }}@push.fury.io/zafnz/

# microsoft/winget-pkgs accepts manifests only as pull requests, so GoReleaser
# commits them to a branch on the fork zafnz/winget-pkgs and opens the pull
# request from there. The fork is never synced with upstream. The branch adds
# one new directory, so the pull request shows only that manifest whatever
# commit the fork's master is at.
#
# PACKAGE_REPOS_TOKEN has to be a classic token with the public_repo scope: a
# fine-grained token cannot open a pull request on a repository its owner does
# not own. A pull request that fails to open is logged and does not fail the
# release, so read the run output after tagging.
winget:
  - name: jqweb
    publisher: zafnz
    package_identifier: zafnz.jqweb
    short_description: Turn JSON into an interactive webpage with one pipe.
    license: MIT
    homepage: https://github.com/zafnz/jqweb
    publisher_url: https://github.com/zafnz
    release_notes_url: "https://github.com/zafnz/jqweb/releases/tag/{{ .Tag }}"
    repository:
      owner: zafnz
      name: winget-pkgs
      branch: "jqweb-{{ .Version }}"
      token: "{{ .Env.PACKAGE_REPOS_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

scoops:
  - repository:
      owner: zafnz
      name: scoop-bucket
      token: "{{ .Env.PACKAGE_REPOS_TOKEN }}"
    directory: bucket
    homepage: https://github.com/zafnz/jqweb
    description: Turn JSON into an interactive webpage with one pipe.
    license: MIT
