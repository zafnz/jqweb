<title>wikipedia-reset-spec.json &middot; jqweb</title>
<style>
:root {
  color-scheme: dark;
  --bg: #101114;
  --fg: #d4d7dd;
  --head-bg: #17191d;
  --head-border: #26292f;
  --muted: #8a9199;
  --dim: #7d848d;
  --btn-bg: #22252b;
  --btn-border: #33373f;
  --btn-hover: #2a2e35;
  --field-bg: #101114;
  --focus: #4a90d9;

  --rule: #24272c;
  --key: #6cb6ff;
  --str: #57d364;
  --bracket: #eceef2;
  --ok: #57d364;
  --fail: #e5534b;
  --hit: rgba(210,168,60,.16);
  --icon: #5e6670;
  --icon-chip: rgba(255,255,255,.12);
  --menu-bg: #1b1e23;
  --menu-on: #2b3038;
  --menu-hover: #262a31;
  --menu-shadow: rgba(0,0,0,.45);
  --gutter: #5c636d;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #fbfbfa;
  --fg: #24292f;
  --head-bg: #f1f1ee;
  --head-border: #dcdcd6;
  --muted: #6a737d;
  --dim: #8a8f96;
  --btn-bg: #ffffff;
  --btn-border: #cfcfc8;
  --btn-hover: #eeeee9;
  --field-bg: #ffffff;
  --focus: #0969da;
  --row-hover: rgba(0,0,0,.05);
  --rule: #e3e3dd;
  --key: #0550ae;
  --str: #0a7d32;
  --bracket: #1f2328;
  --ok: #1a7f37;
  --fail: #cf222e;
  --hit: rgba(226,178,39,.32);
  --icon: #8a9199;
  --icon-chip: rgba(0,0,0,.09);
  --menu-bg: #ffffff;
  --menu-on: #dceafb;
  --menu-hover: #f2f2ee;
  --menu-shadow: rgba(0,0,0,.18);
  --gutter: #9a9a94;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
header {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 14px; background: var(--head-bg); border-bottom: 1px solid var(--head-border);
}
header .name { color: var(--muted); margin-right: 4px; }
header button {
  font: inherit; color: var(--fg); background: var(--btn-bg);
  border: 1px solid var(--btn-border); border-radius: 4px; padding: 3px 10px; cursor: pointer;
}
header button:hover { background: var(--btn-hover); }
#fold { margin-left: auto; }
#theme { padding: 3px 9px; }
.qwrap { position: relative; flex: 1 1 220px; min-width: 220px; }
#q {
  font: inherit; width: 100%; color: inherit;
  background: var(--field-bg); border: 1px solid var(--btn-border); border-radius: 4px;
  padding: 4px 9px; outline: none;
}
#q:focus { border-color: var(--focus); }
#q::-webkit-search-cancel-button {
  -webkit-appearance: none; appearance: none;
  height: 1.4em; width: 1.4em; margin-left: 4px; cursor: pointer; opacity: .5;
  background:
    linear-gradient(45deg, transparent 44%, currentColor 44%, currentColor 56%, transparent 56%),
    linear-gradient(-45deg, transparent 44%, currentColor 44%, currentColor 56%, transparent 56%);
  background-size: .78em .78em; background-position: center; background-repeat: no-repeat;
}
#q::-webkit-search-cancel-button:hover { opacity: 1; }
#stats { color: var(--muted); }
main { padding: 10px 14px 60px; }

.line { white-space: pre-wrap; word-break: break-word; border-radius: 3px; }
.line:hover { background: var(--row-hover); }
.toggle, .sp { display: inline-block; width: 1.15em; }
.toggle {
  background: none; border: none; padding: 0; margin: 0;
  color: var(--dim); cursor: pointer; font: inherit; text-align: left;
}
.toggle::before { content: "\25BE"; }
.node.collapsed > .line > .toggle::before { content: "\25B8"; }
.kids { margin-left: .55em; padding-left: .8em; border-left: 1px solid var(--rule); }
.closer { padding-left: 1.15em; }
.node.collapsed > .kids, .node.collapsed > .closer { display: none; }
.node:not(.collapsed) > .line > .fold { display: none; }
.fold { color: var(--dim); cursor: pointer; }

.key { color: var(--key); font-weight: 600; }
.str { color: var(--str); }
.num { color: var(--fg); }
.bool { color: var(--fg); font-weight: 600; }
.null { color: var(--muted); font-weight: 600; }
.p { color: var(--bracket); font-weight: 600; }
.pn { color: var(--fg); }
.c { color: var(--muted); }

.cp, .fq {
  background: none; border: none; border-radius: 3px; padding: 1px 4px;
  font: inherit; font-size: .92em; color: var(--icon); cursor: pointer;
}
.fq { margin-left: 1px; }
.line:hover .cp, .line:hover .fq { color: var(--muted); }
.cp:hover, .fq:hover, .cp:focus, .fq:focus {
  color: var(--fg); background: var(--icon-chip); outline: none;
}
.cp:focus-visible, .fq:focus-visible { outline: 1px solid var(--focus); outline-offset: -1px; }
.cp.ok { color: var(--ok); }
.cp.fail { color: var(--fail); }

.node.hidden { display: none; }
.node.hit > .line { background: var(--hit); }
#q.bad, #q.bad:focus { border-color: var(--fail); }

#fault {
  position: absolute; z-index: 10; top: calc(100% + 4px); left: 0; width: 100%;
  background: var(--menu-bg); border: 1px solid var(--fail); border-radius: 4px;
  padding: 4px 8px; color: var(--fail); box-shadow: 0 6px 20px var(--menu-shadow);
}
#mode {
  font: inherit; color: var(--fg); background: var(--btn-bg);
  border: 1px solid var(--btn-border); border-radius: 4px; padding: 3px 4px; cursor: pointer;
}

#suggest {
  position: absolute; z-index: 10; top: calc(100% + 4px); left: 0;
  width: 100%;
  background: var(--menu-bg); border: 1px solid var(--btn-border); border-radius: 4px;
  padding: 3px; box-shadow: 0 6px 20px var(--menu-shadow);
  max-height: 60vh; overflow-y: auto;
}
.sg { display: flex; align-items: stretch; border-radius: 3px; }
.sg.on { background: var(--menu-on); }
.sg:hover { background: var(--menu-hover); }
.sgq {
  font: inherit; color: var(--fg); background: none; border: none; cursor: pointer;
  flex: 1; display: flex; gap: 18px; align-items: baseline;
  justify-content: space-between; text-align: left; padding: 3px 6px;
}
.sgt { white-space: pre-wrap; word-break: break-all; }
.sgn { color: var(--muted); white-space: nowrap; }
.sg.on .sgn { color: var(--fg); }
.sgc {
  font: inherit; color: var(--icon); background: none; border: none;
  border-radius: 3px; cursor: pointer; padding: 3px 6px;
}
.sg:hover .sgc { color: var(--muted); }
.sgc:hover, .sgc:focus { color: var(--fg); background: var(--icon-chip); outline: none; }
.sgc:focus-visible { outline: 1px solid var(--focus); outline-offset: -1px; }
.sgc.ok { color: var(--ok); }
.sgc.fail { color: var(--fail); }

.result { position: relative; padding-left: 2.6em; margin-bottom: 3px; }
.result::before {
  content: attr(data-n);
  position: absolute; left: 0; width: 2em;
  text-align: right; color: var(--gutter);
}
#results.one .result { padding-left: 0; }
#results.one .result::before { content: none; }
</style>
<script>
var jqtheme = (function () {
  'use strict';
  var KEY = 'jqweb-theme';
  var ORDER = ['auto', 'light', 'dark'];
  var root = document.documentElement;
  var light = window.matchMedia('(prefers-color-scheme: light)');
  var pref = root.getAttribute('data-pref') || 'auto';
  try {
    pref = localStorage.getItem(KEY) || pref;
  } catch (e) {  }
  if (ORDER.indexOf(pref) < 0) pref = 'auto';
  function paint() {
    root.setAttribute('data-theme', pref === 'auto' ? (light.matches ? 'light' : 'dark') : pref);
    root.setAttribute('data-pref', pref);
  }
  function cycle() {
    pref = ORDER[(ORDER.indexOf(pref) + 1) % ORDER.length];
    try {
      localStorage.setItem(KEY, pref);
    } catch (e) {  }
    paint();
    return pref;
  }
  if (light.addEventListener) {
    light.addEventListener('change', function () { if (pref === 'auto') paint(); });
  }
  paint();
  return { cycle: cycle, current: function () { return pref; } };
})();
</script>

  <div id="results" hidden></div>
</main>

ing of images.\n* CollapseTable: server-side portion/prep for collapsing tables.\n\nWhat's not included? What parts of the PageLibrary does a client still have to do?\n* Theme support: Themes can be turned on by adding a theme class to the root \u003chtml> tag.\n  Possible class names are:\n  * `pagelib_theme_default`\n  * `pagelib_theme_dark`\n  * `pagelib_theme_black`\n  * `pagelib_theme_sepia`\n\n  The pagelib JS has functionality to do that: ThemeTransform.setTheme(document, theme).\n* Dim images: DimImagesTransform.dim(window, enable)\n* PlatformTransform.classify(window) to trigger Android and iOS app specific CSS rules\n* LazyLoadTransformer: client side companion of LazyLoadTransform (note the extra *er*\nhere)\n* FooterTransformer: seems to be more UI than content, requires I18N, too\n\nStability: [experimental](https://www.mediawiki.org/wiki/API_versioning#Experimental)\n","parameters":[{"name":"title","in":"path","description":"Page title. Use underscores instead of spaces. Use percent-encoding. Example: `Main_Page`.","required":true,"schema":{"type":"string"}},{"name":"redirect","in":"query","description":"Requests for [redirect pages](https://www.mediawiki.org/wiki/Help:Redirects) return HTTP 302 with a redirect target in `Location` header and content in the body.\nTo get a 200 response instead, supply `false` to the `redirect` parameter.\n","schema":{"type":"boolean"}}],"responses":{"200":{"description":"mobile-optimized HTML of the given page.","headers":{"ETag":{"description":"Syntax: \"{revision}/{tid}\". Example: \"701384379/154d7bca-c264-11e5-8c2f-1b51b33b59fc\"\n","schema":{"type":"string"}}},"content":{"text/html; charset=utf-8; profile=\"https://www.mediawiki.org/wiki/Specs/Mobile-HTML/1.2.2\"":{"schema":{"type":"string"}}}},"301":{"description":"A permanent redirect is returned if the supplied article title was not in the normalized form.\nTo avoid this kind of redirect, you can use the [mediawiki-title](https://github.com/wikimedia/mediawiki-
